[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-exchange"
version = "0.4.0"
description = "A deterministic price-time-priority exchange matching engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anggun Soracca Jaya"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.5",
]
research = ["matplotlib>=3.8"]

[project.scripts]
redline-demo = "orderbook.cli:main"
redline-replay = "orderbook.replay_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
