[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-exchange"
version = "0.2.0"
description = "A deterministic price-time-priority exchange matching engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anggun Soracca Jaya"}]
dependencies = []

[project.optional-dependencies]
demo = ["fastapi==0.141.1", "pydantic==2.13.5", "starlette==1.6.0", "uvicorn==0.53.0", "httpx==0.28.1"]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.5",
]
native = ["pybind11>=2.13,<4"]
research = ["matplotlib>=3.8"]

[project.scripts]
redline-demo = "orderbook.cli:main"
redline-replay = "orderbook.replay_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Keep the original Ruff default rule set stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
exchange = ["migrations/*.sql"]
