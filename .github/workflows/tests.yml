name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,research,demo]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python benchmark.py --orders 10000
      - run: python run_market_lab.py
      - run: python run_market_study.py

  native-parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,native,research,demo]"
      - run: python scripts/build_native.py
      # Fail explicitly if the extension is missing; parity tests must not skip.
      - run: python -c "from orderbook import _native; print(_native.compiler)"
      - run: python -m pytest -q
      - name: Native memory and undefined-behavior checks
        run: |
          c++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer cpp/test_core.cpp -o /tmp/redline-core-test
          /tmp/redline-core-test
      - run: python compare.py --orders 1000 --repeats 2 --output benchmark-results
      - run: python profile_matching.py --orders 1000
      - run: python study.py --orders 1000 --repeats 2 --seeds 17 42 --output benchmark-results/study-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.python-version }}
          path: |
            benchmark-results/
            profile-results/

  exchange-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e ".[dev,demo]"
      - run: .venv/bin/python -m pytest tests/test_exchange.py -q
      - run: .venv/bin/python scripts/export_contracts.py
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec openapi-typescript openapi.json -o src/contracts.d.ts
      - run: git diff --exit-code -- web/openapi.json web/src/contracts.d.ts
      - run: pnpm --dir web run build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test
      - run: pnpm --dir web run test:research
      - run: .venv/bin/python -m research_copilot.evaluate --output /tmp/research-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exchange-browser-results
          path: |
            web/test-results/
            docs/assets/exchange-lab.png
            docs/assets/research-copilot.png
            /tmp/research-evaluation/
